---
# Codacy configuration. See docs/CODE_QUALITY.md for the reasoning.
engines:
  bandit:
    # pytest asserts are flagged by Bandit B101 (assert_used). Test code is
    # excluded from Bandit only; application code keeps every Bandit check,
    # and Ruff's security rules (S*) still run on tests except S101.
    exclude_paths:
      - "**/tests/**"
# Generated files: v2/openapi.json comes from `./hunterx openapi` and
# mobile/src/api/schema.d.ts from `npm run api:generate`. CI checks both are in
# sync with the server code, so they are not analysed by hand.
exclude_paths:
  - "v2/openapi.json"
  - "mobile/src/api/schema.d.ts"
