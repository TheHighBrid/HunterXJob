name: Backend and Mobile Validation

# v2 has its own focused workflow (v2-tests.yml). This one covers the other two
# components that scripts/test-all.sh validates locally, so CI matches it.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "mobile/**"
      - "scripts/test-all.sh"
      - ".github/workflows/validate.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "mobile/**"
      - "scripts/test-all.sh"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile backend sources
        run: python -m compileall -q app tests

      - name: Run backend tests
        run: python -m pytest -q

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Type-check mobile app
        run: npm run typecheck
