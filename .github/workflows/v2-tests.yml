name: V2 Tests

on:
  push:
    branches: [main]
    paths:
      - "v2/**"
      - ".github/workflows/v2-tests.yml"
      - "ruff.toml"
      - "bandit.yml"
  pull_request:
    branches: [main]
    paths:
      - "v2/**"
      - ".github/workflows/v2-tests.yml"
      - "ruff.toml"
      - "bandit.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: v2/pyproject.toml

      - name: Install v2 test dependencies
        run: python -m pip install -e ".[test]"

      - name: Compile v2 sources
        run: python -m compileall -q app tests

      - name: Run v2 tests
        run: python -m pytest -q

      - name: Lint v2 (Ruff and Bandit, repo-root config)
        run: |
          python -m pip install "ruff==0.16.9" "bandit==1.9.4"
          ruff check .
          bandit -q -c ../bandit.yml -r app scripts tests
