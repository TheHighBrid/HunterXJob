name: V2 Tests

on:
  push:
    branches: [main]
    paths:
      - "v2/**"
      - ".github/workflows/v2-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "v2/**"
      - ".github/workflows/v2-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: v2/pyproject.toml

      - name: Install v2 test dependencies
        run: python -m pip install -e ".[test]"

      - name: Compile v2 sources
        run: python -m compileall -q app tests

      - name: Run v2 tests
        run: python -m pytest -q
