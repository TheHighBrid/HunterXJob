name: V2 Tests

on:
  push:
    branches: [main]
    paths:
      - "v2/**"
      - ".github/workflows/v2-tests.yml"
      - "ruff.toml"
      - "bandit.yml"
  pull_request:
    branches: [main]
    paths:
      - "v2/**"
      - ".github/workflows/v2-tests.yml"
      - "ruff.toml"
      - "bandit.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: v2/pyproject.toml

      - name: Install v2 test dependencies
        run: python -m pip install -e ".[test]"

      - name: Compile v2 sources
        run: python -m compileall -q app tests

      - name: Run v2 tests
        run: python -m pytest -q

      - name: Lint v2 (Ruff and Bandit, repo-root config)
        run: |
          python -m pip install "ruff==0.16.9" "bandit==1.9.4"
          ruff check .
          bandit -q -c ../bandit.yml -r app scripts tests

  # Gate 1 of docs/RECOVERY_CONTRACT.md: the existing dry-run path on plain
  # Linux with Playwright-owned Chromium against repo fixtures over loopback.
  # Fake fixture data only; no real employer site is contacted.
  gate1:
    # Pinned: Playwright 1.47's `install --with-deps` targets Ubuntu <= 24.04, and
    # ubuntu-latest moves to a newer release on 2026-10-19.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: v2

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: v2/pyproject.toml

      - name: Install v2 with test and browser extras
        run: python -m pip install -e ".[test,browser]"

      - name: Install Playwright-owned Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run Gate 1 (3 independent runs)
        run: python scripts/gate1.py --runs 3

      - name: Gate 1 negative proofs (POST, HEAD, auto-submit, iframe submit, process leak)
        run: python -m pytest -m gate1 -q

      - name: Upload Gate 1 report and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate1-report
          path: |
            v2/gate-artifacts/gate1-report.json
            v2/gate-artifacts/run-*/run.json
            v2/gate-artifacts/run-*/child.log
            v2/gate-artifacts/run-*/traces/*.zip
          if-no-files-found: error
          retention-days: 30
