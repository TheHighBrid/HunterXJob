name: V2 and Mobile Tests

on:
  push:
    branches: [main]
    paths:
      - "v2/**"
      - "mobile/**"
      - ".github/workflows/v2-tests.yml"
      - "ruff.toml"
      - "bandit.yml"
  pull_request:
    branches: [main]
    paths:
      - "v2/**"
      - "mobile/**"
      - ".github/workflows/v2-tests.yml"
      - "ruff.toml"
      - "bandit.yml"

permissions:
  contents: read

jobs:
  test:
    # Pinned like gate1: the default suite now includes Playwright browser tests (captcha handoff,
    # browser filler, dry-run units), and Playwright 1.47's `install --with-deps` targets Ubuntu <= 24.04.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: v2

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: v2/pyproject.toml

      - name: Install v2 test dependencies
        run: python -m pip install -e ".[test,browser]"

      - name: Install Playwright-owned Chromium
        run: python -m playwright install --with-deps chromium

      - name: Compile v2 sources
        run: python -m compileall -q app tests

      - name: Run v2 tests
        run: python -m pytest -q

      - name: Lint v2 (Ruff and Bandit, repo-root config)
        run: |
          python -m pip install "ruff==0.16.9" "bandit==1.9.4"
          CORE_CI_FILES=(
            "scripts/batch_checks.py"
            "scripts/dryrun_batch.py"
            "scripts/gate1.py"
            "scripts/gate2.py"
            "scripts/gate2_checks.py"
            "tests/test_batch_checks_derivations.py"
            "tests/test_dryrun_batch.py"
            "tests/test_gate2_rehearsal.py"
          )
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.sha }}"
          else
            BASE_REF="${{ github.event.before }}"
            if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BASE_REF}^{commit}" 2>/dev/null; then
              BASE_REF="HEAD^"
            fi
          fi
          CHANGED_FILES=()
          if [ -n "$BASE_REF" ] && git cat-file -e "${BASE_REF}^{commit}" 2>/dev/null; then
            while IFS= read -r -d '' f; do
              if [ -n "$f" ] && [ -f "$f" ]; then
                CHANGED_FILES+=("$f")
              fi
            done < <(git -c core.quotePath=false diff --relative --name-only -z --diff-filter=ACMRT "${BASE_REF}...HEAD" -- '*.py')
          fi
          TARGETS=()
          for f in "${CORE_CI_FILES[@]}" "${CHANGED_FILES[@]}"; do
            if [ ! -f "$f" ]; then
              continue
            fi
            seen=0
            for existing in "${TARGETS[@]}"; do
              if [ "$existing" = "$f" ]; then
                seen=1
                break
              fi
            done
            if [ "$seen" -eq 0 ]; then
              TARGETS+=("$f")
            fi
          done
          echo "Lint targets (${#TARGETS[@]}): ${TARGETS[*]}"
          if [ "${#TARGETS[@]}" -gt 0 ]; then
            ruff check "${TARGETS[@]}"
            bandit -q -c ../bandit.yml "${TARGETS[@]}"
          fi
          bandit -q -c ../bandit.yml -lll -r app scripts tests

  # Gate 1 of docs/RECOVERY_CONTRACT.md: the existing dry-run path on plain
  # Linux with Playwright-owned Chromium against repo fixtures over loopback.
  # Fake fixture data only; no real employer site is contacted.
  gate1:
    # Pinned: Playwright 1.47's `install --with-deps` targets Ubuntu <= 24.04, and
    # ubuntu-latest moves to a newer release on 2026-10-19.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: v2

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: v2/pyproject.toml

      - name: Install v2 with test and browser extras
        run: python -m pip install -e ".[test,browser]"

      - name: Install Playwright-owned Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run Gate 1 (3 independent runs)
        run: python scripts/gate1.py --runs 3

      - name: Gate 1 negative proofs (POST, HEAD, auto-submit, iframe submit, process leak)
        run: python -m pytest -m gate1 -q

      - name: Gate 2 runner rehearsal (loopback fixtures only; --live never runs in CI)
        run: python scripts/gate2.py --rehearse

      - name: Upload Gate 1 report and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate1-report
          path: |
            v2/gate-artifacts/gate1-report.json
            v2/gate-artifacts/run-*/run.json
            v2/gate-artifacts/run-*/child.log
            v2/gate-artifacts/run-*/traces/*.zip
            v2/gate-artifacts/gate2/gate2-report.json
          if-no-files-found: error
          retention-days: 30

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check mobile app
        run: npm run typecheck

      - name: Run Jest test suite
        run: npm test -- --ci
