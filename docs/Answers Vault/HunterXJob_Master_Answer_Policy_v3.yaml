question_bank:
- key: salary_expectation
  stage: 1
  category: compensation
  questions:
  - What are your salary expectations?
  - What is your desired annual salary?
  - Expected base salary (CAD)
  - Desired compensation
  - What compensation are you seeking?
  - What is your salary requirement?
  - Prétentions salariales?
  - Salaire annuel souhaité?
  mode: auto
  answer: '60000'
  answer_variants:
  - 60,000
  - 60 000
  - 60K
  - 60k
  - '60.000'
  - $60,000 CAD
  - CAD 60,000
  option_equivalents: []
  condition: null
  sensitive: true
  notes: CAD annual baseline. Formatting variants mean 60000. Salary figures 70000/85000/95000/107000 are NEGOTIATION LEVELS,
    not equivalent-format fallbacks. May choose appropriate higher expectation only with role-level evidence and pay range.
- key: minimum_acceptable_salary
  stage: 1
  category: compensation
  questions:
  - What is the minimum annual salary you would accept?
  - Minimum base salary (CAD)?
  mode: auto
  answer: '60000'
  answer_variants:
  - $60,000 CAD
  - 60K
  option_equivalents: []
  condition: null
  sensitive: true
  notes: Hard targeting minimum. Do not use this number for hourly or USD field without validated currency/units conversion.
- key: start_availability
  stage: 1
  category: availability
  questions:
  - When can you start?
  - Earliest availability?
  - When would you be available to join?
  - When can you begin work?
  - Date de disponibilité?
  mode: auto
  answer: Immediately
  answer_variants:
  - Available immediately
  - As soon as possible
  - ASAP
  - Immediate start
  - In 2 weeks
  - Within 14 days
  option_equivalents: []
  condition: null
  sensitive: false
  notes: Immediately is preferred. Two weeks only if immediately is not offered, or the actual employer start requirements
    justify it. Dates must be calculated when a date picker requires YYYY-MM-DD; never enter words in a date input.
- key: notice_period
  stage: 1
  category: availability
  questions:
  - What is your notice period?
  - How much notice must you give?
  - What is your current notice?
  - Délai de préavis?
  mode: auto
  answer: '0'
  answer_variants:
  - No notice required
  - Immediately
  - 0 weeks
  - Two weeks
  - 2 weeks
  - 14 days
  option_equivalents: []
  condition: null
  sensitive: false
  notes: 0 is the truthful default for preferred start. An optional two-week transition is flexibility, not an obligatory
    notice period.
- key: self_employed
  stage: 1
  category: employment
  questions:
  - Are you self-employed?
  - Do you operate your own business?
  - Are you the owner of a company?
  - Do you currently run a business?
  mode: auto
  answer: 'Yes'
  answer_variants:
