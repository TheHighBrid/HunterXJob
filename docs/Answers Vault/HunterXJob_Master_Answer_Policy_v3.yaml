schema_version: '3.0'
project: HunterXJob
as_of: '2026-10-27'
purpose: Portable, provenance-aware application question/answer policy. Not an import schema for the current HunterXJob API.
provenance:
  source: direct_user_instructions_plus_prior_profile_context
  confidence_label: user_provided_or_contextual
  confirmation_policy: Only direct user answers eligible for auto after exact field match; other facts require verified profile
    or human review.
decision_contract:
  unknown_required: REVIEW
  unknown_optional: SKIP
  sensitive_unknown: REVIEW_OR_DECLINE_IF_USER_APPROVED
  never_infer:
  - criminal history
  - government clearance
  - driver licence
  - car ownership
  - US citizenship
  - US sponsorship
  - ethnicity
  - race
  - sexual orientation
  - disability
  - veteran status
  - gender
  - marital status
  - DOB
  - SIN
  - SSN
  - certifications
  - technical experience
  - prior rejection
  - company relationships
  - stock holdings
  source_precedence:
  - company_scoped_explicit_answer
  - platform_scoped_explicit_answer
  - global_explicit_answer
  - verified_profile
  - verified_job_specific_context
  - manual_review
  same_scope_conflict: REVIEW
  unmatched_question: REVIEW_IF_REQUIRED_ELSE_SKIP
  options: Use exact option semantics, not closest text. If no equivalent allowed option exists, review. Distinguish yes/no,
    negative polarity, ranges, multi-select, date and numbers.
  consent: Background-check consent is explicitly granted. Other legal agreements, privacy terms, recordings, reference checks
    and self-ID remain unapproved unless independently authorized.
  no_live_submission_implicit: The answer policy never itself authorizes application submission, bypass of CAPTCHA, falsification
    or anti-bot circumvention.
  question_8: Bare answer No is unbound and MUST NOT apply to any live field.
  confirmation: Prove real submission with an employer confirmation page/email/receipt; a click or successful form fill does
    not prove submission.
targeting:
  currency: CAD
  salary_minimum_annual: 60000
  salary_baseline_annual: 60000
  salary_format_equivalents:
  - '60000'
  - 60,000
  - 60 000
  - '60.000'
  - 60K
  - $60,000 CAD
  salary_negotiation_candidates_not_equivalent:
  - 70000
  - 85000
  - 95000
  - 107000
  salary_rule: Use a higher figure only when supported by the role pay band/seniority and candidate expectations. Never blindly
    substitute salary figures. Do not reinterpret CAD as USD or annual as hourly.
  location_priority:
  - Ottawa ON and Gatineau QC, any work model
  - Elsewhere Canada, fully remote only
  enabled_countries:
  - CA
  disabled_countries:
  - US
  - other
  us_authorized_but_search_disabled: true
  ottawa_gatineau_modes:
  - on_site
  - hybrid
  - remote
  rest_of_canada_modes:
  - remote
  relocation_allowed: false
  employer_exclusions:
  - TD
  - RBC
  - BMO
  - Scotiabank
  - Tangerine
  role_relevance:
  - collections
  - accounts receivable
  - fraud
  - disputes
  - credit operations
  - portfolio management
  - financial operations
  - customer operations
  - bilingual support
  - operations analyst
  - data/IT roles only when VERIFIED skill fit is shown
  remote_requirements: Check hiring jurisdiction, payroll eligibility, required physical office visits and actual onsite days;
    marketing label Remote is insufficient.
  employment_status: Self-employed, owns/operates MELATO; not employed by a separate company as of supplied context.
