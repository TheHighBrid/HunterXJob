<!DOCTYPE html>
<html>
<head><title>Recruitee - Application</title></head>
<body>
  <h2>Cloud Platform Engineer</h2>
  <form id="recruitee-form" method="POST">
    <div class="form-group">
      <label for="candidate_name">Full Name</label>
      <input type="text" id="candidate_name" name="name" required />
    </div>
    <div class="form-group">
      <label for="candidate_email">Email Address</label>
      <input type="email" id="candidate_email" name="email" required />
    </div>
    <div class="form-group">
      <label for="candidate_phone">Phone Number</label>
      <input type="tel" id="candidate_phone" name="phone" required />
    </div>
    <div class="form-group">
      <label for="candidate_cv">Upload CV</label>
      <input type="file" id="candidate_cv" name="cv" data-ui="cv-input" required />
    </div>
    <div class="form-group">
      <label for="candidate_cover">Cover Letter</label>
      <textarea id="candidate_cover" name="cover_letter"></textarea>
    </div>
    <div class="form-group">
      <label for="open_question">Why do you want to join our team?</label>
      <textarea id="open_question" name="open_question"></textarea>
    </div>
    <button type="submit" class="recruitee-submit-button">Apply now</button>
  </form>
</body>
</html>
